name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/bjr-3hneil
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Vercel
        run: |
          npx vercel deploy dist \
            --prod \
            --yes \
            --token=${{ secrets.VERCEL_TOKEN }}
